spring.datasource.url=jdbc:postgresql://localhost:5433/trabalho
spring.datasource.username=trabalho
spring.datasource.password=trabalho_local
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.default_batch_fetch_size=0
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.cache.type=caffeine
spring.cache.cache-names=clientes
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=60s
logging.level.org.hibernate.SQL=DEBUG
